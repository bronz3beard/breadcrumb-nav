name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The release workflow runs these same checks before it stages anything.
  workflow_call:

# Least privilege: every job only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (node ${{ matrix.node }}, react ${{ matrix.react }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
        react: ['19']
        include:
          # 18.3 is the declared peer floor (^18.3.0); one leg proves it.
          - node: 22
            react: '18'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Use the React 18.3 peer floor
        if: matrix.react == '18'
        run: npm install --no-save react@18.3 react-dom@18.3 @types/react@18 @types/react-dom@18
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check:links
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:classes
      - run: npm run check:package
      - run: npm run check:size
      - run: npm pack --dry-run
